<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Teacher Login | SAIMS</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="container" style="max-width:460px;margin:70px auto">
<section class="panel"><h1>Teacher Login</h1><p>CHRIST’S ARROWS COLLEGE ADUM-EAST</p>
<form id="loginForm"><label>Email<input id="email" type="email" required></label><br>
<label>Password<input id="password" type="password" required></label><br>
<button class="btn primary" type="submit">Login</button><p id="message"></p></form>
<p><a href="login.html">Administrator Login</a></p><p><a href="student-login.html">Student Login</a></p></section></main>
<script type="module">
import {auth,db} from "./js/firebase-config.js";
import {signInWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import {doc,getDoc} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
document.getElementById("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();const m=document.getElementById("message");m.textContent="Signing in...";
 try{const c=await signInWithEmailAndPassword(auth,email.value,password.value);const u=await getDoc(doc(db,"users",c.user.uid));
 if(!u.exists()||u.data().role!=="teacher"){await auth.signOut();throw new Error("This account is not registered as a teacher.");}
 location.href="teacher/dashboard.html";
 }catch(err){m.textContent=err.message||"Login failed.";m.style.color="crimson";}
});
</script></body></html>
